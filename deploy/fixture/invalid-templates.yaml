#
# PodTemplates that the reject test creates sandboxes from. Each one copies the valid fixture
# PodTemplate and breaks exactly one rule of DESIGN.md section 6, named by its document's
# rule number; the test expects the gateway to refuse each with InvalidArgument for that rule.
---
apiVersion: v1
kind: PodTemplate
metadata:
  name: odp-rule-1
  namespace: openshell
template:
  metadata:
    labels:
      app: odp-rule-1
  spec:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    containers:
      - name: agent
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["httpd"]
        args: ["-f", "-p", "8080", "-h", "/tmp/bundle"]
        ports:
          - name: http
            containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
          - name: served
            mountPath: /tmp/bundle
      - name: helper
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sleep", "3600"]
    volumes:
      - name: served
        emptyDir: {}
---
