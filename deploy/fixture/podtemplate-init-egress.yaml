#
# PodTemplate for the egress init test. It is the fixture PodTemplate with one more init
# container, which probes the TCP echo before the sandbox runtime starts. The probe writes
# "connected" or "failed" to init-result in the served emptyDir, and it always exits 0, so the
# pod still starts. The probe names the echo by its fixed ClusterIP, because the runtime's DNS
# is not served until the runtime runs.
apiVersion: v1
kind: PodTemplate
metadata:
  name: odp-fixture-egress
  namespace: openshell
template:
  metadata:
    labels:
      app: odp-fixture-egress
    annotations:
      odp.fixture/owner: egress
  spec:
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    nodeSelector:
      kubernetes.io/os: linux
    tolerations:
      - key: odp-fixture
        operator: Exists
        effect: NoSchedule
    initContainers:
      - name: stage-bundle
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c", "cp -L /bundle/index.html /bundle/ready /tmp/bundle/"]
        volumeMounts:
          - name: bundle
            mountPath: /bundle
            readOnly: true
          - name: served
            mountPath: /tmp/bundle
      - name: egress-probe
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["sh", "-c"]
        args:
          - >-
            printf odp-init-probe | nc -w 3 10.96.200.9 9000 > /tmp/bundle/init-echo 2>/dev/null;
            if grep -q odp-init-probe /tmp/bundle/init-echo; then echo connected; else echo failed; fi > /tmp/bundle/init-result
        volumeMounts:
          - name: served
            mountPath: /tmp/bundle
    containers:
      - name: agent
        image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
        command: ["httpd"]
        args: ["-f", "-p", "8080", "-h", "/tmp/bundle"]
        ports:
          - name: http
            containerPort: 8080
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 64Mi
        volumeMounts:
          - name: served
            mountPath: /tmp/bundle
          - name: sandbox-home
            mountPath: /sandbox
    volumes:
      - name: bundle
        configMap:
          name: odp-fixture-bundle
      - name: served
        emptyDir: {}
      - name: sandbox-home
        emptyDir: {}
