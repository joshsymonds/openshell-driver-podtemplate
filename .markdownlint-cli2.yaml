globs:
  - "**/*.md"
gitignore: false
ignores:
  - "target/**"
  - ".devenv/**"
  - ".direnv/**"
config:
  default: true
  # Allow long lines; prose paragraphs are single-line per project style.
  MD013: false
  # Allow GitHub-rendered HTML commonly used in READMEs.
  MD033:
    allowed_elements: [p, img, br, a, div, details, summary, kbd, sub, sup]
  # Allow duplicate headings in different sections.
  MD024:
    siblings_only: true
  # Bare URLs are fine in changelogs and tables.
  MD034: false
  # Internal docs commonly use bare fences for diagrams and terminal sketches.
  MD040: false
  # Repo uses padded table pipes (`| a | b |`). markdownlint 0.40 has no
  # "padded" value (it is silently ignored); its "compact" style is that layout.
  MD060:
    style: compact
