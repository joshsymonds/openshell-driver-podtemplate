# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true
no-default-features = false

# -- Advisories (RustSec + NVD) ------------------------------------------------
[advisories]
yanked = "warn"
unmaintained = "workspace"
maximum-db-staleness = "P30D"

# -- Licenses ------------------------------------------------------------------
[licenses]
confidence-threshold = 0.8
unused-allowed-license = "allow"

allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # Permissive, non-copyleft license pulled in by the prebuilt Z3 archive
    # path (z3-sys -> zip -> bzip2); compatible with this Apache-2.0 project.
    "bzip2-1.0.6",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]

[licenses.private]
ignore = true
registries = []

# -- Bans ----------------------------------------------------------------------
[bans]
deny = [
    { name = "ring", reason = "Use the selected crypto backend instead." },
]
# Each older duplicate below is pulled in by the dependency named in its reason.
skip = [
    { crate = "base64@0.22.1", reason = "Pulled in by jsonwebtoken, kube-client, k8s-openapi and tonic." },
    { crate = "cpufeatures@0.2.17", reason = "Pulled in by sha2 0.10." },
    { crate = "getrandom@0.2.17", reason = "Pulled in by jsonwebtoken 10." },
    { crate = "getrandom@0.3.4", reason = "Pulled in by ahash 0.8 and rand_core 0.9." },
    { crate = "hashbrown@0.15.5", reason = "Pulled in by kube-runtime and petgraph." },
    { crate = "miniz_oxide@0.8.9", reason = "Pulled in by backtrace 0.3." },
    { crate = "pem@3.0.6", reason = "Pulled in by jsonwebtoken 10, kube-client and openshell-crypto." },
    { crate = "r-efi@5.3.0", reason = "Pulled in by getrandom 0.3.4." },
    { crate = "rand@0.9.5", reason = "Pulled in by opentelemetry_sdk 0.32." },
    { crate = "rand_core@0.9.5", reason = "Pulled in by rand 0.9 and rand_chacha 0.9." },
    { crate = "syn@2.0.119", reason = "Pulled in by proc-macro crates such as darling, prost-build, tonic-build and schemars_derive." },
    { crate = "synstructure@0.13.2", reason = "Pulled in by asn1-rs-derive 0.6." },
    { crate = "unicode-width@0.1.14", reason = "Pulled in by miette 7." },
    { crate = "untrusted@0.7.1", reason = "Pulled in by aws-lc-rs 1.18." },
    { crate = "windows-sys@0.60.2", reason = "Pulled in by notify 8.2." },
]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"

# -- Sources -------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/NVIDIA/OpenShell"]
