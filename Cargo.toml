[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
openshell-core = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5", default-features = false }
openshell-isolation-interface = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
openshell-policy = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
openshell-sandbox-backend = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
k8s-openapi = { version = "0.24", features = ["v1_29"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4.5", features = ["derive", "env"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
openshell-driver-kubernetes = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5" }
openshell-crypto = { git = "https://github.com/NVIDIA/OpenShell", tag = "v0.1.5", default-features = false, features = ["aws-lc"] }
kube = { version = "0.99", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
tokio = { version = "1.43", features = ["full"] }
tonic = "0.14"
prost = "0.14"
prost-types = "0.14"
futures = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower = "0.5"
http = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_lifetimes = "warn"
unused_qualifications = "warn"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Allow certain pedantic lints that are too noisy
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# Allow noisy nursery lints
significant_drop_tightening = "allow"  # Often gives incorrect suggestions
missing_const_for_fn = "allow"  # Too noisy for async code patterns

# Allow noisy pedantic lints
too_many_lines = "allow"  # Function length limits are subjective
needless_pass_by_value = "allow"  # Common pattern in async handlers
ref_option = "allow"  # Common pattern for optional references
missing_fields_in_debug = "allow"  # Manual Debug impls often intentionally omit fields
